name: E2E MLOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install flake8 linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8 code audit
        run: flake8 ./lab3 --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        working-directory: ./lab3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run automated unit tests
        working-directory: ./lab3
        run: pytest -v

  build_image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Multi-stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./lab3
          file: ./lab3/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iris_api_service:${{ github.sha }}
